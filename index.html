    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight · <span class="status" data-role="status"></span></p>

    <main data-testid="board">
      <div data-testid="loader" class="loader" role="status" aria-live="polite">Loading incidents…</div>

      <p id="confirm-text" data-role="confirm-text"></p>
      <div class="confirm-actions">
        <button type="button" data-testid="confirm-cancel">Cancel</button>
        <button type="button" data-testid="confirm-ack" class="primary">Ack</button>
      </div>
    </div>
